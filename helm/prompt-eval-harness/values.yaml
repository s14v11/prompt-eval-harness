replicaCount: 2

image:
  repository: prompt-eval-harness
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: prompt-eval.local
  tls:
    enabled: false
    secretName: prompt-eval-harness-tls

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  environment: production
  databaseUrl: "sqlite:////data/prompt_eval.db"
  redisUrl: "redis://prompt-eval-harness-redis:6379/0"
  corsOrigins: "https://prompt-eval.local"
  defaultJudgeModel: "gpt-4o-mini"

secrets:
  openaiApiKey: ""
  anthropicApiKey: ""
  googleApiKey: ""

livenessProbe:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10
